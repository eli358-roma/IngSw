<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>
<!-- Barra di navigazione -->
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark" style="background: linear-gradient(90deg, #4361ee, #3a0ca3);">
    <div class="container-fluid">
        <a class="navbar-brand" href="/dashboard">
            <i class="bi bi-code-slash me-2"></i>
            <strong>HackHub</strong>
            <small class="ms-2 opacity-75">v1.0</small>
        </a>
        <div class="navbar-nav ms-auto">
            <div class="nav-item dropdown">
                <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                    <i class="bi bi-person-circle me-1"></i>
                    <span th:text="${#authentication?.name ?: 'Guest'}">Admin</span>
                </a>
                <ul class="dropdown-menu">
                    <li><a class="dropdown-item" href="/profile"><i class="bi bi-person me-2"></i>Profilo</a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li><a class="dropdown-item text-danger" href="#"><i class="bi bi-box-arrow-right me-2"></i>Logout</a></li>
                </ul>
            </div>
        </div>
    </div>
</nav>

<!-- Sidebar -->
<div th:fragment="sidebar" class="col-lg-2 col-md-3 d-none d-md-block sidebar p-0">
    <div class="p-4">
        <h4 class="mb-4"><i class="bi bi-layout-sidebar-inset me-2"></i>Menu</h4>
        <ul class="nav flex-column">
            <li class="nav-item">
                <a class="nav-link" th:classappend="${#request.requestURI.startsWith('/dashboard')} ? 'active'" href="/dashboard">
                    <i class="bi bi-speedometer2 me-2"></i>Dashboard
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:classappend="${#request.requestURI.startsWith('/hackathons')} ? 'active'" href="/hackathons">
                    <i class="bi bi-trophy me-2"></i>Hackathon
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:classappend="${#request.requestURI.startsWith('/teams')} ? 'active'" href="/teams">
                    <i class="bi bi-people me-2"></i>Team
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:classappend="${#request.requestURI.startsWith('/submissions')} ? 'active'" href="/submissions">
                    <i class="bi bi-upload me-2"></i>Sottomissioni
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:classappend="${#request.requestURI.startsWith('/judges')} ? 'active'" href="/judges">
                    <i class="bi bi-award me-2"></i>Valutazioni
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:classappend="${#request.requestURI.startsWith('/mentors')} ? 'active'" href="/mentors">
                    <i class="bi bi-chat-dots me-2"></i>Supporto
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:classappend="${#request.requestURI.startsWith('/reports')} ? 'active'" href="/reports">
                    <i class="bi bi-bar-chart me-2"></i>Report
                </a>
            </li>
            <li class="nav-item mt-4">
                <a class="nav-link" th:classappend="${#request.requestURI.startsWith('/admin')} ? 'active'" href="/admin">
                    <i class="bi bi-shield-lock me-2"></i>Amministrazione
                </a>
            </li>
        </ul>

        <div class="mt-5">
            <h6 class="text-uppercase opacity-75 mb-3">Statistiche</h6>
            <div class="mb-2">
                <small class="opacity-75">Utenti online</small>
                <div class="d-flex justify-content-between">
                    <span>12</span>
                    <span class="badge bg-success">Online</span>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
