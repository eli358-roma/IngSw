<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>I Miei Inviti - HackHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>
<body>
<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/dashboard">HackHub</a>
        <div class="text-white">
            <span th:text="${session.username}"></span>
            <a href="/logout" class="btn btn-sm btn-light ms-2">Logout</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="card">
        <div class="card-header bg-primary text-white">
            <h4><i class="bi bi-envelope-paper"></i> I Miei Inviti</h4>
        </div>
        <div class="card-body">
            <div id="invitesList">
                <div class="text-center py-4">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Caricamento...</span>
                    </div>
                    <p>Caricamento inviti...</p>
                </div>
            </div>
        </div>
    </div>

    <div class="mt-3">
        <a href="/dashboard" class="btn btn-secondary">← Torna alla Dashboard</a>
    </div>
</div>

<script>
    function loadInvites() {
        fetch('/api/teams/my-invites')
            .then(response => response.json())
            .then(invites => {
                const container = document.getElementById('invitesList');

                if (invites.length === 0) {
                    container.innerHTML = `
                        <div class="text-center py-5">
                            <i class="bi bi-inbox display-1 text-muted"></i>
                            <h5 class="mt-3 text-muted">Nessun invito in sospeso</h5>
                            <p>Quando qualcuno ti inviterà in un team, vedrai qui gli inviti.</p>
                        </div>
                    `;
                    return;
                }

                let html = '<div class="list-group">';
                invites.forEach(invite => {
                    html += `
                        <div class="list-group-item">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <h5 class="mb-1">Invito al team: <strong>${invite.name}</strong></h5>
                                    <p class="mb-1">Sei stato invitato a partecipare a questo team.</p>
                                    <small class="text-muted">Team ID: ${invite.id}</small>
                                </div>
                                <div>
                                    <button class="btn btn-success me-2" onclick="acceptInvite(${invite.id})">
                                        <i class="bi bi-check-lg"></i> Accetta
                                    </button>
                                    <button class="btn btn-danger" onclick="declineInvite(${invite.id})">
                                        <i class="bi bi-x-lg"></i> Rifiuta
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                });
                html += '</div>';
                container.innerHTML = html;
            })
            .catch(error => {
                document.getElementById('invitesList').innerHTML = `
                    <div class="alert alert-danger">
                        Errore nel caricamento degli inviti: ${error.message}
                    </div>
                `;
            });
    }

    function acceptInvite(teamId) {
        fetch('/api/teams/invites/' + teamId + '/accept', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' }
        })
        .then(response => response.text())
        .then(message => {
            alert(message);
            loadInvites(); // Ricarica la lista
            setTimeout(() => {
                window.location.href = '/dashboard';
            }, 1500);
        })
        .catch(error => {
            alert('Errore: ' + error.message);
        });
    }

    function declineInvite(teamId) {
        if (!confirm('Sei sicuro di voler rifiutare questo invito?')) return;

        fetch('/api/teams/invites/' + teamId + '/decline', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' }
        })
        .then(response => response.text())
        .then(message => {
            alert(message);
            loadInvites(); // Ricarica la lista
        })
        .catch(error => {
            alert('Errore: ' + error.message);
        });
    }

    loadInvites();
</script>
</body>
</html>
