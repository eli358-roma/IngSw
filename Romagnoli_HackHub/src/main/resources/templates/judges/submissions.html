<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Valutazioni - Judge Dashboard</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2 th:text="'Valutazioni per: ' + ${hackathon.name}"></h2>

    <div th:if="${param.success}" class="alert alert-success">
        Valutazione salvata con successo!
    </div>

    <div th:if="${param.error}" class="alert alert-danger" th:text="${param.error}">
        Errore
    </div>

    <h3 class="mt-4">Team da valutare</h3>
    <div th:if="${pendingTeams.isEmpty()}">
        <p class="text-muted">Nessun team in attesa di valutazione</p>
    </div>
    <div th:each="team : ${pendingTeams}" class="card mb-3">
        <div class="card-body">
            <h5 th:text="${team.name}">Nome Team</h5>
            <p><strong>Progetto:</strong> <span th:text="${team.projectName}"></span></p>
            <p><strong>Descrizione:</strong> <span th:text="${team.projectDescription}"></span></p>
            <p><strong>Repository:</strong> <a th:href="${team.repositoryUrl}" target="_blank">Link</a></p>

            <form method="post" action="/judge/evaluate">
                <input type="hidden" name="teamId" th:value="${team.id}">
                <div class="mb-3">
                    <label>Punteggio (0-10):</label>
                    <input type="number" step="0.1" min="0" max="10" name="score" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label>Feedback:</label>
                    <textarea name="feedback" class="form-control" rows="3" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Salva Valutazione</button>
            </form>
        </div>
    </div>

    <h3 class="mt-4">Team già valutati</h3>
    <div th:if="${evaluatedTeams.isEmpty()}">
        <p class="text-muted">Nessun team valutato</p>
    </div>
    <div th:each="team : ${evaluatedTeams}" class="card mb-3">
        <div class="card-body">
            <h5 th:text="${team.name}">Nome Team</h5>
            <p><strong>Progetto:</strong> <span th:text="${team.projectName}"></span></p>
            <p><strong>Punteggio:</strong> <span class="badge bg-success" th:text="${team.score}"></span></p>
            <p><strong>Feedback:</strong> <span th:text="${team.judgeFeedback}"></span></p>
        </div>
    </div>
</div>
</body>
</html>
