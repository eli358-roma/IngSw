<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Giudice</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .navbar-custom {
            background: linear-gradient(90deg, #4361ee, #3a0ca3);
        }
        .hackathon-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s;
            border-left: 5px solid #4361ee;
        }
        .hackathon-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }
        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
<!-- Barra di navigazione -->
<nav class="navbar navbar-dark navbar-custom">
    <div class="container">
        <a class="navbar-brand" href="/judge/dashboard">
            <i class="bi bi-gavel me-2"></i>
            HackHub - Giudice
        </a>
        <div class="text-white">
            <i class="bi bi-person-circle me-1"></i>
            <span th:text="${session.username}">Giudice</span>
            <a href="/logout" class="btn btn-sm btn-light ms-3">
                <i class="bi bi-box-arrow-right"></i> Logout
            </a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h2 class="mb-4">
        <i class="bi bi-award text-primary"></i>
        Dashboard Giudice
    </h2>

    <!-- Statistiche -->
    <div class="row mb-4">
        <div class="col-md-4">
            <div class="stat-card text-center">
                <h1 class="text-primary" th:text="${hackathons.size()}">0</h1>
                <p class="text-muted">Hackathon assegnati</p>
            </div>
        </div>
        <div class="col-md-4">
            <div class="stat-card text-center">
                <h1 class="text-warning" th:text="${totalPending}">0</h1>
                <p class="text-muted">Team da valutare</p>
            </div>
        </div>
        <div class="col-md-4">
            <div class="stat-card text-center">
                <h1 class="text-success" th:text="${totalEvaluated}">0</h1>
                <p class="text-muted">Team valutati</p>
            </div>
        </div>
    </div>

    <!-- Lista Hackathon -->
    <h3 class="mb-3">
        <i class="bi bi-trophy"></i>
        I miei hackathon
    </h3>

    <div th:if="${hackathons.isEmpty()}" class="alert alert-info">
        <i class="bi bi-info-circle"></i>
        Non sei stato assegnato come giudice a nessun hackathon.
    </div>

    <div class="row">
        <div th:each="h : ${hackathons}" class="col-md-6">
            <div class="hackathon-card">
                <h4 th:text="${h.name}">Nome Hackathon</h4>
                <p class="text-muted" th:text="${h.description}">Descrizione</p>

                <div class="mb-2">
                        <span class="badge bg-info">
                            <i class="bi bi-people"></i>
                            Team: <span th:text="${h.teams.size()}">0</span>
                        </span>
                    <span class="badge bg-warning ms-2">
                            <i class="bi bi-hourglass"></i>
                            Stato: <span th:text="${h.status}">STATO</span>
                        </span>
                </div>

                <a th:href="@{/judge/hackathon/{id}(id=${h.id})}"
                   class="btn btn-primary w-100 mt-3">
                    <i class="bi bi-pencil-square"></i>
                    Valuta progetti
                </a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
